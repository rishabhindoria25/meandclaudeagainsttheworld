; Zephyr - ESP32 IR bridge for GE room air conditioners.
;
; Build:  pio run
; Flash:  pio run -t upload
; OTA:    pio run -e ota -t upload   (after the first USB flash)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; The web UI is compiled into the binary. This script gzips web/index.html and
; emits src/web_asset.h before every build, so the UI and firmware can never
; drift out of sync.
extra_scripts = pre:tools/build_web.py

lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
    bblanchon/ArduinoJson@^7.1.0
    mathieucarbou/ESPAsyncWebServer@^3.1.0
    knolleary/PubSubClient@^2.8

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    ; _IR_ENABLE_DEFAULT_ false + explicit sends keeps the binary small enough
    ; to leave room for OTA on a 4MB board.
    -DDECODE_AC=true

[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv

[env:ota]
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_protocol = espota
upload_port = zephyr.local
