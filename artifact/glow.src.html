<style>

.grid { display: grid; gap: 12px; }

.check input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--accent); }

.example-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 44px 0 14px; border-top: 1px solid var(--line); padding-top: 26px; }

@media (max-width: 860px) {
  .hero, .working { grid-template-columns: 1fr; gap: 28px; }

}

<div class="wrap">
  <nav class="top">
    <button class="brand" id="home" aria-label="Glow, start over"><i>✦</i>Glow</button>
    <span class="privacy">🔒 Your photo stays in this page except when sent to Claude</span>
  </nav>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script>
"use strict";
/* ============================================================
   Glow — personalized aesthetic enhancement plans, in an artifact.
   Claude (via the viewer's own account) reads the photo, locates the
   facial features, and writes the plan. Everything else — reframing,
   the landmark-guided retouch, detail crops, tone sampling and the
   report card — happens right here in the page.
   ============================================================ */

const AREAS = ["hair", "brows", "eyes", "skin", "lips", "facial_hair"];
const AREA_LABEL = { hair: "Hair", brows: "Brows", eyes: "Eyes", skin: "Skin", lips: "Lips", facial_hair: "Facial hair" };
const VIBES = [["natural", "Natural"], ["polished", "Polished"], ["bold", "Bold"], ["low-maintenance", "Low-maintenance"]];
const MAKEUP = [["none", "No makeup"], ["minimal", "Minimal"], ["full", "Full glam OK"]];
const LANGS = ["English", "Español", "Français", "Deutsch", "Português", "Italiano", "हिन्दी", "日本語", "한국어", "中文", "العربية"];
const TIP_ICON = { scissors: "✂", droplet: "💧", sun: "☀", brush: "🖌", moon: "☾", water: "◌", sparkle: "✦", leaf: "❦" };
const DEMO_PLAN = /*DEMO_PLAN*/null;

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem("glow:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("glow:" + k, JSON.stringify(v)); } catch {} },
};

const state = {
  view: "start",            // start | working | results
  photo: null,              // {url, blob, w, h}
  prefs: Object.assign({ vibe: "natural", makeup: "minimal", language: "English", focus: [], notes: "" }, store.get("prefs", {}), { notes: "" }),
  stages: [],
  error: null,
  result: null,             // the user's result
  example: null,            // the illustrated example
  tab: "Report",
  template: store.get("template", "editorial"),
  sample: undefined,        // resolved capability or null
  imagesOK: false,
  downloads: null,
  ctl: null,
};

/* ---------------- Capabilities ---------------- */
(async () => {
  try {
    const s = await window.claude?.use?.("sample");
    state.sample = s ?? null;
    if (s) {
      const lim = await s.limits().catch(() => null);
      state.imagesOK = !!lim?.images;
    }
  } catch { state.sample = null; }
  try { state.downloads = (await window.claude?.use?.("downloads")) ?? null; } catch { state.downloads = null; }
  render();
})();

/* ---------------- Images ---------------- */
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function canvasOf(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function toBlob(c, q = 0.9) { return new Promise((r) => c.toBlob(r, "image/jpeg", q)); }

async function normalizePhoto(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error("That file isn't an image. Try a JPEG, PNG or WebP.");
  if (file.size > 25e6) throw new Error("That image is over 25 MB. Try a smaller one.");
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { throw new Error("This browser couldn't read that image (HEIC?). Export it as JPEG and try again."); }
  const s = Math.min(1, 1536 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
  const c = canvasOf(w, h), x = c.getContext("2d");
  x.imageSmoothingQuality = "high";
  x.drawImage(bmp, 0, 0, w, h);
  bmp.close?.();
  const blob = await toBlob(c, 0.9);   // re-encoding strips EXIF/GPS
  return { url: c.toDataURL("image/jpeg", 0.9), blob, w, h };
}

async function cropUrl(src, r, outW) {
  const img = await loadImg(src);
  const ow = Math.round(outW ?? r.w), oh = Math.round(ow * r.h / r.w);
  const c = canvasOf(ow, oh), x = c.getContext("2d");
  x.imageSmoothingQuality = "high";
  x.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, ow, oh);
  return c.toDataURL("image/jpeg", 0.9);
}

/* ---------------- Face geometry ----------------
   Claude returns normalized feature points; everything else derives here. */
const PTS = ["hair", "brow_left", "brow_right", "eye_left", "eye_right", "nose_tip", "mouth_left", "mouth_right", "cheek_left", "cheek_right", "chin"];

function toGeo(g, W, H) {
  const fb = g?.face_box ?? {};
  const box = { x: clamp(+fb.x || .3, 0, 1) * W, y: clamp(+fb.y || .25, 0, 1) * H, w: clamp(+fb.w || .4, .02, 1) * W, h: clamp(+fb.h || .4, .02, 1) * H };
  const p = {};
  const def = {
    hair: [.5, -.12], brow_left: [.3, .28], brow_right: [.7, .28], eye_left: [.32, .38], eye_right: [.68, .38], nose_tip: [.5, .6],
    mouth_left: [.38, .78], mouth_right: [.62, .78], cheek_left: [.25, .6], cheek_right: [.75, .6], chin: [.5, .98],
  };
  for (const k of PTS) {
    const q = g?.points?.[k];
    p[k] = q && isFinite(+q.x) && isFinite(+q.y)
      ? { x: clamp(+q.x, 0, 1) * W, y: clamp(+q.y, 0, 1) * H }
      : { x: box.x + def[k][0] * box.w, y: box.y + def[k][1] * box.h };
  }
  return { W, H, box, p };
}

function shiftGeo(geo, r) {
  const p = {};
  for (const k in geo.p) p[k] = { x: geo.p[k].x - r.x, y: geo.p[k].y - r.y };
  return { W: r.w, H: r.h, box: { ...geo.box, x: geo.box.x - r.x, y: geo.box.y - r.y }, p };
}

function portraitRect(geo) {
  const { W, H, box } = geo;
  if (box.w / W > .42) return null;
  let cw = Math.min(W, box.w * 2.7), ch = Math.min(H, cw * 5 / 4);
  cw = Math.min(cw, ch * 4 / 5);
  const cx = box.x + box.w / 2, cy = box.y + box.h * .5;
  return {
    x: Math.round(clamp(cx - cw / 2, 0, W - cw)), y: Math.round(clamp(cy - ch * .45, 0, H - ch)),
    w: Math.round(cw), h: Math.round(ch),
  };
}

function anchors(geo) {
  const { p, box } = geo, fw = box.w;
  const inside = (q) => ({ x: clamp(q.x, 6, geo.W - 6), y: clamp(q.y, 6, geo.H - 6) });
  return {
    hair: inside(p.hair),
    brows: inside(p.brow_left),
    eyes: inside(p.eye_left),
    skin: inside(p.cheek_right),
    lips: inside(p.mouth_right),
    facial_hair: inside({ x: (p.chin.x + p.mouth_right.x) / 2, y: p.chin.y - fw * .08 }),
  };
}

function detailRects(geo) {
  const { p, box, W, H } = geo, fw = box.w;
  const around = (c, cw) => {
    cw = Math.min(cw, W); const ch = Math.min(cw * 2 / 3, H);
    return { x: clamp(c.x - cw / 2, 0, W - cw), y: clamp(c.y - ch / 2, 0, H - ch), w: cw, h: ch };
  };
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  return {
    hair: around({ x: box.x + box.w / 2, y: Math.min(p.hair.y, box.y) + fw * .05 }, fw * 1.25),
    brows: around({ x: mid(p.brow_left, p.brow_right).x, y: mid(p.brow_left, p.brow_right).y + fw * .04 }, fw * .95),
    eyes: around(p.eye_left, fw * .5),
    skin: around({ x: p.cheek_right.x - fw * .03, y: p.cheek_right.y }, fw * .5),
    lips: around(mid(p.mouth_left, p.mouth_right), fw * .55),
    facial_hair: around({ x: p.chin.x, y: p.chin.y - fw * .1 }, fw * .8),
  };
}

function median(data) {
  const r = [], g = [], b = [];
  for (let i = 0; i < data.length; i += 4) { if (data[i + 3] < 200) continue; r.push(data[i]); g.push(data[i + 1]); b.push(data[i + 2]); }
  if (!r.length) return "#888888";
  const m = (a) => a.sort((x, y) => x - y)[a.length >> 1];
  return "#" + [m(r), m(g), m(b)].map((v) => v.toString(16).padStart(2, "0")).join("");
}

async function tones(src, geo) {
  const img = await loadImg(src);
  const c = canvasOf(geo.W, geo.H), x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  const at = (q, r) => {
    const sx = Math.round(clamp(q.x - r, 0, geo.W - 2)), sy = Math.round(clamp(q.y - r, 0, geo.H - 2));
    const s = Math.max(2, Math.round(r * 2));
    return median(x.getImageData(sx, sy, Math.min(s, geo.W - sx), Math.min(s, geo.H - sy)).data);
  };
  const r = geo.box.w * .03, p = geo.p;
  return {
    skin: at(p.cheek_right, r * 1.4),
    hair: at(p.hair, r),
    lips: at({ x: (p.mouth_left.x + p.mouth_right.x) / 2, y: (p.mouth_left.y + p.mouth_right.y) / 2 + geo.box.w * .03 }, r * .5),
    brows: at(p.brow_left, r * .4),
  };
}

/* ---------------- On-device retouch ----------------
   Feathered elliptical masks from the feature points. Evens skin while
   keeping 40% of fine texture, lifts under-eyes, adds lip color and
   brow definition, and a touch of global warmth. Never moves pixels. */
function blurCanvas(src, radius) {
  const f = Math.max(2, Math.round(radius));
  let cur = src;
  for (let i = 0; i < 2; i++) {
    const sw = Math.max(1, Math.round(src.width / f)), sh = Math.max(1, Math.round(src.height / f));
    const s = canvasOf(sw, sh), sx = s.getContext("2d"); sx.imageSmoothingQuality = "high"; sx.drawImage(cur, 0, 0, sw, sh);

async function retouch(src, geo, areas, k = .7) {

  const { W, H, box, p } = geo, fw = box.w, on = new Set(areas);
  const base = canvasOf(W, H), bx = base.getContext("2d", { willReadFrequently: true });
  bx.drawImage(img, 0, 0, W, H);
  const o = bx.getImageData(0, 0, W, H).data;
  const b = blurCanvas(base, fw * .012).getContext("2d").getImageData(0, 0, W, H).data;
  const fe = fw * .025;
  const mouthC = { x: (p.mouth_left.x + p.mouth_right.x) / 2, y: (p.mouth_left.y + p.mouth_right.y) / 2 };
  const mouthW = Math.hypot(p.mouth_right.x - p.mouth_left.x, p.mouth_right.y - p.mouth_left.y);
  const tilt = Math.atan2(p.eye_right.y - p.eye_left.y, p.eye_right.x - p.eye_left.x);

  const skinM = mask(W, H, fe, (x) => {
    ell(x, box.x + box.w / 2, box.y + box.h * .55, box.w * .45, box.h * .5, tilt);
    x.globalCompositeOperation = "destination-out";

    for (const e of [p.brow_left, p.brow_right]) ell(x, e.x, e.y, fw * .14, fw * .045, tilt);

    const me = (on.has("eyes") || on.has("skin")) ? eyeM[px] * k : 0;
    if (me > 0) { const l = 1 + .12 * me; r *= l; g *= l; bl *= l * .99; }
    const ml = on.has("lips") ? lipM[px] * k : 0;
    if (ml > 0) {
      const gr = .299 * r + .587 * g + .114 * bl, s = 1 + .28 * ml;
      r = gr + (r - gr) * s; g = gr + (g - gr) * s; bl = gr + (bl - gr) * s;

    if (mb > 0) { const dd = 1 - .14 * mb; r *= dd; g *= dd; bl *= dd; }

    g = 128 + (g - 128) * (1 + .035 * k);
    bl = 128 + (bl - 128) * (1 + .035 * k) - 1.5 * k;
    d[i] = r; d[i + 1] = g; d[i + 2] = bl; d[i + 3] = 255;

}

async function createPlan() {
  const ph = state.photo;
  if (!ph || !state.sample) return;
  state.view = "working"; state.stages = ["Sending your photo to Claude"]; state.error = null;
  render();
  const ctl = new AbortController(); state.ctl = ctl;
  const seen = new Set();
  try {
    const raw = await state.sample.json(buildPrompt(state.prefs), {
      images: ph.blob, modelTier: "complex", signal: ctl.signal,
      onText: ({ text }) => {
        const t = text.replace(/\s+/g, "");
        let changed = false;
        for (const [m, label] of STAGES) if (!seen.has(m) && t.includes(m)) { seen.add(m); state.stages.push(label); changed = true; }
        if (changed) renderStages();
      },
    });
    const plan = normalizePlan(raw);
    const bad = { not_a_face: "We couldn't find a clear face in that photo. Try a front-facing selfie.", multiple_people: "There's more than one person in that photo. Try a solo selfie.", too_low_quality: "That photo is too dark, blurry or small. Try one in natural light." };
    if (bad[plan.suitability]) { state.error = bad[plan.suitability]; state.view = "start"; render(); return; }
    if (!plan.features.length) throw { code: "invalid_json" };
    state.stages.push("Retouching on your device"); renderStages();
    state.result = await buildResult(ph.url, ph.w, ph.h, plan, false);
    state.view = "results"; state.tab = plan.suitability === "likely_minor" ? "Plan" : "Report";
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    state.view = "start";
    if (e?.code !== "cancelled") state.error = ERR[e?.code] || (e?.message && !e.code ? e.message : ERR.upstream_error);
    render();
  }
}

async function buildResult(url, W, H, plan, isExample) {
  let geo = toGeo(plan.geometry, W, H), src = url;
  const rect = portraitRect(geo);
  if (rect) { src = await cropUrl(url, rect); geo = shiftGeo(geo, rect); }
  const areas = plan.features.map((f) => f.area);
  const minor = plan.suitability === "likely_minor";
  const after = minor ? src : await retouch(src, geo, areas, .7);
  const res = { plan, before: src, after, geo, intensity: .7, tones: await tones(src, geo), details: {}, isExample, minor };

}
async function refreshDetails(res) {
  const rects = detailRects(res.geo);

  await Promise.all(res.plan.features.map(async (f) => { out[f.area] = await cropUrl(res.after, rects[f.area], 480); }));
  res.details = out;
}

function layoutBadges(ys, gap, top, bottom) {
  const o = ys.map((y, i) => ({ y, i })).sort((a, b) => a.y - b.y), pl = [];
  o.forEach((e, k) => pl.push(k ? Math.max(Math.max(e.y, top), pl[k - 1] + gap) : Math.max(e.y, top)));
  if (pl.length && pl[pl.length - 1] > bottom) for (let k = pl.length - 1; k >= 0; k--) pl[k] = Math.max(top, Math.min(pl[k], k === pl.length - 1 ? bottom : pl[k + 1] - gap));
  const out = []; o.forEach((e, k) => (out[e.i] = pl[k])); return out;
}

    <label style="display:block;max-width:520px;margin:18px auto 0"><span style="display:flex;justify-content:space-between;font-size:14px"><span>Retouch strength</span><span class="muted" data-kval>${Math.round(res.intensity * 100)}%</span></span><input class="range" type="range" min="0" max="1" step="0.05" value="${res.intensity}" data-intensity></label>

  if (tab === "Plan") return `${P.summary ? `<p class="muted" style="font-size:15.5px;max-width:70ch;margin:0 0 16px">${esc(P.summary)}</p>` : ""}${P.features.map((f, i) => `<div class="feat"><button aria-expanded="${i === 0}" data-feat>${res.details[f.area] ? `<img src="${res.details[f.area]}" alt="">` : ""}<span><span class="t" style="display:block">${esc(f.label)}</span><span class="cap">${esc(f.caption)}</span></span><span class="pill">${{ low: "Low effort", medium: "Some effort", high: "Higher effort" }[f.effort]}</span></button><div class="body" ${i === 0 ? "" : "hidden"}><div><div class="label">Now</div><ul>${f.current.map((c) => `<li>${esc(c)}</li>`).join("")}</ul><div class="label" style="margin-top:14px">Change</div><ul>${f.changes.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>${f.why ? `<div class="why"><strong>Why it works:</strong> ${esc(f.why)}</div>` : ""}</div><div><div class="label">How to</div><ol>${f.how_to.map((c) => `<li>${esc(c)}</li>`).join("")}</ol>${f.products.length ? `<div class="label" style="margin-top:14px">Products</div>${f.products.map((p) => `<div class="prod"><strong>${esc(p.category)}</strong><div class="muted">${esc(p.why)}</div></div>`).join("")}` : ""}</div></div></div>`).join("")}`;

  if (tab === "Skin") {

    return `<div class="grid g5"><div class="box"><div class="label">Type</div><div class="big" style="font-size:24px">${esc(P.skin.type)}</div></div><div class="box"><div class="label">Undertone</div><div class="big" style="font-size:24px">${esc(P.skin.undertone)}</div></div><div class="box" style="grid-column:span 2"><div class="label">Sampled from your photo</div><div class="chips" style="margin-top:10px">${Object.entries(res.tones).map(([k, h]) => `<div style="text-align:center;font-size:11.5px" class="muted"><div style="width:36px;height:36px;border-radius:99px;background:${h};border:1px solid var(--line)" title="${h}"></div>${AREA_LABEL[k] || k}</div>`).join("")}</div></div></div>
    <div class="grid g5" style="margin-top:12px">${P.skin.metrics.map((m) => `<div class="box ring"><svg viewBox="0 0 64 64" role="img" aria-label="${esc(m.name)}: ${m.score} of 100"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${m.score / 100 * C} ${C}" transform="rotate(-90 32 32)"/><text x="32" y="32" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="var(--ink)">${m.score}</text></svg><div style="font-weight:500;margin-top:4px">${esc(m.name)}</div><div class="muted" style="font-size:12.5px">${esc(m.note)}</div></div>`).join("")}</div>

function lum(hex) { const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }

/* ---------------- Wiring ---------------- */
function wire() {
  const file = $("#file"), drop = $("#drop");
  $("#pick")?.addEventListener("click", () => file.click());
  file?.addEventListener("change", () => { takeFile(file.files[0]); file.value = ""; });
  if (drop) {
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); takeFile(e.dataTransfer.files[0]); });
  }
  document.querySelectorAll("[data-vibe]").forEach((b) => b.onclick = () => setPref("vibe", b.dataset.vibe));
  document.querySelectorAll("[data-makeup]").forEach((b) => b.onclick = () => setPref("makeup", b.dataset.makeup));
  document.querySelectorAll("[data-focus]").forEach((b) => b.onclick = () => { const a = b.dataset.focus, f = state.prefs.focus; setPref("focus", f.includes(a) ? f.filter((x) => x !== a) : [...f, a]); });
  $("#lang")?.addEventListener("change", (e) => setPref("language", e.target.value, true));
  $("#notes")?.addEventListener("input", (e) => { state.prefs.notes = e.target.value; });
  $("#go")?.addEventListener("click", createPlan);
  $("#stop")?.addEventListener("click", () => state.ctl?.abort());
  $("#again")?.addEventListener("click", reset);

  document.querySelectorAll("[data-scope]").forEach((sec) => {
    const isEx = sec.dataset.scope === "ex", res = isEx ? state.example : state.result;
    sec.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { state[isEx ? "exTab" : "tab"] = b.dataset.tab; render(); });
    sec.querySelectorAll("[data-theme-pick]").forEach((b) => b.onclick = () => { state.template = b.dataset.themePick; store.set("template", state.template); render(); });
    sec.querySelectorAll("[data-feat]").forEach((b) => b.onclick = () => { const body = b.nextElementSibling, open = b.getAttribute("aria-expanded") === "true"; b.setAttribute("aria-expanded", String(!open)); body.hidden = open; });
    sec.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied ✓"; } catch { b.textContent = "Select the text above to copy"; } });
    sec.querySelectorAll("[data-step]").forEach((c) => c.onchange = () => toggleStep(res, c.dataset.step));
    const save = sec.querySelector("[data-save]"); if (save) save.onclick = () => savePNG(sec, save);
    const cmp = sec.querySelector("[data-compare]"); if (cmp) wireCompare(cmp);
    const k = sec.querySelector("[data-intensity]"); if (k) wireIntensity(k, res, sec);
  });
}

function setPref(k, v, silent) { state.prefs[k] = v; const { notes, ...rest } = state.prefs; store.set("prefs", rest); if (!silent) { const n = $("#notes")?.value; if (n != null) state.prefs.notes = n; render(); } }

async function takeFile(f) {
  if (!f) return;
  state.error = null;
  try { state.photo = await normalizePhoto(f); } catch (e) { state.error = e.message; }
  render();
}
document.addEventListener("paste", (e) => {
  if (state.view !== "start") return;
  const it = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
  if (it) takeFile(it.getAsFile());
});

function reset() { state.ctl?.abort(); state.result = null; state.photo = null; state.error = null; state.view = "start"; render(); window.scrollTo({ top: 0 }); }
$("#home").onclick = reset;

function wireCompare(el) {
  const before = el.querySelector(".before"), bar = el.querySelector(".bar"), input = el.querySelector("input");
  const set = (pct) => { pct = clamp(pct, 0, 100); before.style.clipPath = `inset(0 ${100 - pct}% 0 0)`; bar.style.left = pct + "%"; input.value = pct; };
  const move = (x) => { const r = el.getBoundingClientRect(); set((x - r.left) / r.width * 100); };
  el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); move(e.clientX); input.focus({ preventScroll: true }); });
  el.addEventListener("pointermove", (e) => { if (e.buttons) move(e.clientX); });
  input.addEventListener("input", () => set(+input.value));
}

let intensityTimer;
function wireIntensity(input, res, sec) {
  input.addEventListener("input", () => {
    sec.querySelector("[data-kval]").textContent = Math.round(input.value * 100) + "%";
    clearTimeout(intensityTimer);
    intensityTimer = setTimeout(async () => {
      res.intensity = +input.value;
      res.after = await retouch(res.before, res.geo, res.plan.features.map((f) => f.area), res.intensity);
      await refreshDetails(res);
      const img = sec.querySelector("[data-compare] > img"); if (img) img.src = res.after;
    }, 220);
  });
}

function toggleStep(res, id) {
  const today = new Date().toISOString().slice(0, 10), prev = store.get("routine", {});
  const done = { ...(prev.date === today ? prev.done : {}), [id]: !(prev.date === today && prev.done?.[id]) };
  const all = [...res.plan.routine.am.map((_, i) => "am" + i), ...res.plan.routine.pm.map((_, i) => "pm" + i)].every((k) => done[k]);
  const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  let streak = prev.streak || 0;
  if (all && prev.lastComplete !== today) streak = prev.lastComplete === yest ? streak + 1 : 1;
  store.set("routine", { date: today, done, streak, lastComplete: all ? today : prev.lastComplete });
  render();
}

async function savePNG(sec, btn) {
  const node = sec.querySelector("[data-card] > div > div"), msg = sec.querySelector("[data-save-msg]");
  btn.disabled = true; btn.textContent = "Rendering…";
  try {
    const blob = await window.htmlToImage.toBlob(node, { pixelRatio: 1.5, width: 1600, height: node.offsetHeight, style: { transform: "none" }, skipFonts: false });
    await state.downloads.save({ filename: `glow-plan-${state.template}.png`, data: blob });
    msg.textContent = "Saved.";
  } catch (e) {
    msg.textContent = e?.code === "declined" ? "" : e?.code === "unavailable" ? "Saving isn't available in this view." : "Couldn't render the image. Try again.";
  } finally { btn.disabled = false; btn.textContent = "↓ Save PNG"; }
}

function fitCards() {
  document.querySelectorAll("[data-card]").forEach((wrap) => {
    const inner = wrap.firstElementChild, card = inner.firstElementChild;
    const s = wrap.clientWidth / 1600;
    inner.style.transform = `scale(${s})`;
    wrap.style.height = card.offsetHeight * s + "px";
  });
}
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fitCards, 80); });
document.fonts?.ready.then(fitCards);
